<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question List - OA WINNER</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/question-list.css">
</head>
<body>
    <div class="header">
        <h1>🏆 OA WINNER</h1>
    </div>
    
    <div class="nav">
        <a href="demo.html">📊 Dashboard</a>
        <a href="#">⏰ Today's Review</a>
        <a href="question-list.html" class="active">📝 Question List</a>
        <a href="#">📈 Statistics</a>
    </div>
    
    <div class="container">
        <a href="demo.html" class="back-link">← Back to Dashboard</a>
        
        <div class="section">
            <h2>📝 Add a new question</h2>
            
            <form id="questionForm">
                <div class="form-group">
                    <label for="problemNumber" class="form-label">Problem Number</label>
                    <input 
                        type="text" 
                        id="problemNumber" 
                        name="problemNumber" 
                        class="form-input" 
                        placeholder="#1, #2, #100..."
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="title" class="form-label">Title</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        class="form-input" 
                        placeholder="Two Sum"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select id="difficulty" name="difficulty" class="form-select" required>
                        <option value="">Select difficulty...</option>
                        <option value="easy" class="difficulty-option easy">Easy</option>
                        <option value="medium" class="difficulty-option medium">Medium</option>
                        <option value="hard" class="difficulty-option hard">Hard</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tags" class="form-label">Tags</label>
                    <input 
                        type="text" 
                        id="tags" 
                        name="tags" 
                        class="form-input" 
                        placeholder="Array, Hash Table, Two Pointers..."
                    >
                    <div class="tags-hint">Separate multiple tags with commas (e.g., Array, Hash Table, Two Pointers)</div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Add Question</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelForm()">Cancel</button>
                </div>
            </form>
        </div>
        
        <div class="section">
            <h2>📚 Your Questions</h2>
            <div id="questionList">
                <p style="color: var(--text-secondary); text-align: center; padding: var(--spacing-xl);">
                    No questions added yet. Use the form above to add your first question!
                </p>
            </div>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/question-list.js"></script>
</body>
</html>
